# Dedicated headless graph: no ALSA device discovery, no hardware sink.
context.properties = {
    core.daemon = true
    core.name = garage-pipewire
    default.clock.rate = 48000
    default.clock.allowed-rates = [ 48000 ]
    default.clock.quantum = 1024
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.* = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-rt args = { nice.level = -11 } flags = [ ifexists nofail ] }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-link-factory }
    { name = libpipewire-module-session-manager }
]
context.objects = [
    { factory = adapter args = {
        factory.name = support.null-audio-sink
        node.name = garage_music
        node.description = "Garage music DSP input"
        media.class = Audio/Sink
        audio.position = [ FL FR ]
        audio.rate = 48000
        object.linger = true
        monitor.channel-volumes = false
        adapter.auto-port-config = { mode = dsp monitor = true position = preserve }
    } }
]
