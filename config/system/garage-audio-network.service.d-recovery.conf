# Install as /etc/systemd/system/garage-audio-network.service.d/recovery.conf (root 0644).
# Replace <release> with the immutable release directory holding audio-lifecycle.py.
[Unit]
Wants=network-online.target
# Bounds systemd-level retries of pre-admission (exit 75) failures.
StartLimitIntervalSec=1800
StartLimitBurst=4

[Service]
ExecStart=
ExecStart=/usr/bin/python3 -B /opt/garage-audio/releases/<release>/audio-lifecycle.py
TimeoutStopSec=90
# Restart=no is retained for every application/security exit (status 1). Only
# EX_TEMPFAIL (75: carrier/DHCP/Docker not ready before any dependent existed,
# after the owner's own bounded retries) is retried by systemd.
RestartForceExitStatus=75
RestartSec=60

[Install]
# Enabling is a standing acceptance of the startup provider-resume risk at every
# boot; see docs/audio-recovery.md "Startup sound risk".
WantedBy=multi-user.target
