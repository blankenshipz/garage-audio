# Install as /etc/needrestart/conf.d/90-garage-audio.conf (root 0644).
# needrestart must not restart the lifecycle owner after library upgrades: an
# owner restart is an operator start (sound-risk prerequisite, generation
# admission). containerd is excluded for the same reason docker already is.
$nrconf{override_rc}{qr(^garage-audio-network\.service$)} = 0;
$nrconf{override_rc}{qr(^garage-ma-enrollment)} = 0;
$nrconf{override_rc}{qr(^containerd\.service$)} = 0;
