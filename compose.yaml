name: garage-audio
services:
  music-assistant:
    image: ghcr.io/music-assistant/server:2.10.5@sha256:28023f8c0d96ca2496391f3218a6d70d7ef3ba84db846b3a3f3cd9ce7ef8aedc
    restart: unless-stopped
    user: "1000:1000"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # Host networking is required for Spotify/Soloist LAN DNS-SD pairing.
    # MA UI/stream listeners are pinned to the LAN IP in persisted MA settings.
    network_mode: host
    volumes:
      - ./state/ma:/data
      - ./state/music:/music:ro
    environment:
      LOG_LEVEL: info
